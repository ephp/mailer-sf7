framework:
    rate_limiter:
        tracking_open:
            policy: sliding_window
            limit: 200
            interval: '1 minute'
            cache_pool: cache.app
        tracking_click:
            policy: sliding_window
            limit: 100
            interval: '1 minute'
            cache_pool: cache.app
        unsubscribe:
            policy: sliding_window
            limit: 30
            interval: '1 minute'
            cache_pool: cache.app
        subscribe:
            policy: sliding_window
            limit: 10
            interval: '1 minute'
            cache_pool: cache.app
        # Throttle dell'invio email: garantisce mai più di N invii in una
        # qualsiasi finestra di 60s, così l'SMTP d'Aruba (max 12/min) non
        # rifiuta e non manda in bounce. Attaccato al transport "async" in
        # messenger.yaml. cache.app = stato persistente, sopravvive ai restart
        # del worker.
        messenger_email:
            policy: sliding_window
            limit: 12
            interval: '1 minute'
            cache_pool: cache.app
