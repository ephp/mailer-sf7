nelmio_api_doc:
    documentation:
        info:
            title: MailFlow Public API
            description: >
                API pubblica MailFlow per l'integrazione con siti esterni.
                Autenticazione via header X-API-Key.
            version: 1.0.0
        components:
            securitySchemes:
                ApiKey:
                    type: apiKey
                    in: header
                    name: X-API-Key
        security:
            - ApiKey: []
    areas:
        path_patterns:
            - ^/api/public/v1
